name: Build and push images

# Builds and pushes the backend and frontend images to GHCR (multi-arch) for ONE OCS version.
# Triggered by pushing a git tag equal to a `version` in versions.json (e.g. 3.0.0-rc1), or manually with that version as input.
# Only the tagged version is built; its build inputs (refs, extras, custom Dockerfile) come from its versions.json entry.
# Images are tagged `:<version>` only (no moving `:latest`).

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version from versions.json to build (e.g. 3.0.0-rc1)"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Resolve build matrix from versions.json
        id: set
        env:
          # On a tag push, github.ref_name is the tag; on manual run, the input.
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          ver="${VERSION#v}"   # tolerate an optional leading 'v'
          entry="$(jq -c --arg v "$ver" '.versions[] | select(.version == $v)' versions.json)"
          if [ -z "$entry" ]; then
            echo "::error::Version '$ver' not found in versions.json"; exit 1
          fi
          matrix="$(jq -cn --argjson e "$entry" '{include: [$e | {
            version,
            backend_ref,
            frontend_ref,
            backend_extra_build_apt: (.backend_extra_build_apt // ""),
            backend_extra_pip: (.backend_extra_pip // ""),
            backend_extra_runtime_apt: (.backend_extra_runtime_apt // ""),
            backend_dockerfile: (.backend_dockerfile // "Dockerfile"),
            frontend_dockerfile: (.frontend_dockerfile // "Dockerfile")
          }]}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build (${{ matrix.version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend ---------------------------------------------------------
      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ocsinventory-backend
          tags: |
            type=raw,value=${{ matrix.version }}
          labels: |
            org.opencontainers.image.title=OCS Inventory Backend
            org.opencontainers.image.description=OCS Inventory backend (Django REST API) served by gunicorn.
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push backend (${{ matrix.version }})
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: backend/${{ matrix.backend_dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            OCS_BACKEND_REF=${{ matrix.backend_ref }}
            EXTRA_BUILD_APT=${{ matrix.backend_extra_build_apt }}
            EXTRA_PIP=${{ matrix.backend_extra_pip }}
            EXTRA_RUNTIME_APT=${{ matrix.backend_extra_runtime_apt }}
          cache-from: type=gha,scope=backend-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.version }}

      # --- Frontend --------------------------------------------------------
      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ocsinventory-frontend
          tags: |
            type=raw,value=${{ matrix.version }}
          labels: |
            org.opencontainers.image.title=OCS Inventory Frontend
            org.opencontainers.image.description=OCS Inventory frontend (Vue SPA) and nginx edge proxy.
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build & push frontend (${{ matrix.version }})
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/${{ matrix.frontend_dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            OCS_FRONTEND_REF=${{ matrix.frontend_ref }}
          cache-from: type=gha,scope=frontend-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.version }}
